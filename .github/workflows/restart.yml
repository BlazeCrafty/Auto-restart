name: Auto-Restart BlazeCraftSMP

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-and-restart:
    runs-on: ubuntu-latest
    steps:
      - name: Check and restart if offline
        run: |
          SERVER="blazecraftsmpgg.falixsrv.me"
          PORT=25565

          echo "Checking if $SERVER is online..."

          if nc -z -w 10 "$SERVER" "$PORT" 2>/dev/null; then
            echo "✅ Server is ONLINE - no action needed"
          else
            echo "❌ Server is OFFLINE - sending start request..."
            
            curl -s -X POST "https://falixnodes.net/server/start" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "User-Agent: Mozilla/5.0" \
              -H "Referer: https://falixnodes.net/startserver" \
              -H "Origin: https://falixnodes.net" \
              --data "ip=blazecraftsmpgg.falixsrv.me" \
              --max-time 30

            echo "🚀 Start request sent!"
          fi
